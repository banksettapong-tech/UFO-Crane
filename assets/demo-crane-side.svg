<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Side angle demo claw machine camera view">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset="0.5" stop-color="#f6fdff"/>
      <stop offset="1" stop-color="#e7f5ff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fdff"/>
      <stop offset="1" stop-color="#dae8f4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.54" stop-color="#9deaff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4d4e5"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bccddd"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="38%" r="60%">
      <stop offset="0" stop-color="#35eba3" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#35eba3" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#17304d" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17304d" flood-opacity="0.14"/>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#ff8ab8" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
