<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="High angle demo claw machine camera view">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset="0.52" stop-color="#f7fdff"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfeff"/>
      <stop offset="1" stop-color="#dceaf5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#b8edff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd9e8"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfd0e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#39e99f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39e99f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#17304d" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17304d" flood-opacity="0.14"/>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#ff8ab8" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect x="58" y="38" width="1484" height="824" rx="18" fill="#ffffff" opacity="0.72"/>
  <rect x="82" y="62" width="1436" height="776" rx="12" fill="none" stroke="#8feaff" stroke-width="3" opacity="0.58"/>
  <rect x="112" y="92" width="1376" height="400" fill="url(#dots)" opacity="0.65"/>

